# Minimal-cost EKS cluster: Spot nodes, no NAT Gateway (nodes in public subnets), OIDC on.
# Create:  eksctl create cluster -f eks-cluster.yaml
# Delete:  eksctl delete cluster -f eks-cluster.yaml --disable-nodegroup-eviction --wait
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: three-tier-k8s-eks-cluster
  region: us-west-2
iam:
  withOIDC: true
vpc:
  nat:
    gateway: Disable
managedNodeGroups:
  - name: spot-ng
    instanceTypes: ["t3.medium", "t3a.medium", "t3.large", "t3a.large"]
    spot: true
    minSize: 2
    maxSize: 2
    desiredCapacity: 2
    volumeSize: 20
    privateNetworking: false
